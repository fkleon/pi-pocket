name: pi-pocket

# Hardened service configuration template
x-hardened: &hardened
  # Read-only root filesystem
  read_only: true
  # Run as nobody user
  user: "65534:65534"
  # Drop all capabilities
  cap_drop: [ALL]
  # Prevent privilege escalation
  security_opt:
    - no-new-privileges=true
  pids_limit: 256
  restart: unless-stopped

networks:
  # The internal network is used for communication between internal services,
  # and does not have direct access to the internet.
  internal:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # The edge network allows egress traffic to the internet.
  edge:
    enable_ipv6: false
  # The frontend network allows ingress traffic.
  frontend:
    enable_ipv6: false

configs:
  dnsmasq_conf:
    file: ./docker/dnsmasq.conf
  tinyproxy_conf:
    file: ./docker/tinyproxy.conf
  allowed_domains:
    file: ./docker/tinyproxy.allowlist.conf
  ingress_conf:
    file: ./docker/nginx.conf

services:
  # The internal gateway service that handles egress traffic through tinyproxy.
  # Allowed domains must be allowlisted in the allowed_domains config file.
  gateway:
    <<: *hardened
    build:
      context: ./docker
      dockerfile: tinyproxy.Dockerfile
    image: local/tinyproxy:latest
    configs:
      - source: tinyproxy_conf
        target: /etc/tinyproxy/tinyproxy.conf
      - source: allowed_domains
        target: /etc/tinyproxy/allowed_domains
    tmpfs:
      - /tmp
      - /run
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -x 127.0.0.1:8888 http://tinyproxy.stats"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      dns-forwarder:
        condition: service_healthy
    dns:
      - 172.28.0.11
    networks:
      internal:
      edge:

  # The DNS forwarder service that handles internal DNS resolution.
  # Allowed domains must be allowlisted in the dnsmasq config file.
  dns-forwarder:
    <<: *hardened
    build:
      context: ./docker
      dockerfile: dnsmasq.Dockerfile
    image: local/dnsmasq:latest
    configs:
      - source: dnsmasq_conf
        target: /etc/dnsmasq.conf
    healthcheck:
      test: ["CMD-SHELL", "dnsmasq --test"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.1
    networks:
      internal:
        ipv4_address: 172.28.0.11
      edge:

  chrome:
    <<: *hardened
    image: chromedp/headless-shell:latest
    # Run with init to reap zombie processes
    init: true
    environment:
      HOME: /tmp
      HTTP_PROXY: http://gateway:8888
      HTTPS_PROXY: http://gateway:8888
    command:
      - --disable-gpu
      - --user-data-dir=/tmp/chrome
      - --proxy-server=http://gateway:8888
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    mem_limit: 2g
    cpus: 1.0
    shm_size: 1g
    expose:
      - "9222"
    depends_on:
      gateway:
        condition: service_healthy
    dns:
      - 172.28.0.11
    networks:
      internal:
        ipv4_address: 172.28.0.10
    volumes:
      - pi-workspace:/workspace:ro

  app:
    <<: *hardened
    build:
      context: ./
      dockerfile: docker/Dockerfile
    image: local/pi-pocket:latest
    user: nonroot:nonroot
    environment:
      # Egress config
      HTTP_PROXY: http://gateway:8888
      HTTPS_PROXY: http://gateway:8888
      NO_PROXY: "localhost,127.0.0.1,172.28.0.10,app,gateway,chrome"
      NODE_USE_ENV_PROXY: 1
      # App config
      PI_POCKET_BROWSER_URL: http://chrome:9222
      #PI_POCKET_BROWSER_URL: http://172.28.0.10:9222
      #PI_POCKET_BROWSER_URL: ws://172.28.0.10:9223
      PI_POCKET_GUARD: off
      PI_POCKET_PORT: 8787
      # Pi Pocket config (persistent data)
      PI_POCKET_DIR: /home/nonroot/.pi-pocket
      # Pi config (sign-ins, models, skills)
      PI_CODING_AGENT_DIR: /home/nonroot/.pi/agent
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 1
    depends_on:
      gateway:
        condition: service_healthy
      chrome:
        condition: service_started
    expose:
      - "8787"
    dns:
      - 172.28.0.11
    networks:
      - internal
    volumes:
      - pi-home:/home/nonroot
      - pi-data:/home/nonroot/.pi
      - pi-pocket-data:/home/nonroot/.pi-pocket
      - pi-workspace:/workspace

  ingress:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:alpine
    configs:
      - source: ingress_conf
        target: /etc/nginx/conf.d/default.conf
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "8787:8787"
    mem_limit: 128m
    cpus: 0.1
    depends_on:
      - app
    networks:
      - frontend
      - internal

volumes:
    pi-home:
    pi-pocket-data:
    pi-data:
    pi-workspace:
