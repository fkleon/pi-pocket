Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 50
DisableViaHeader Yes
#LogLevel Warning
LogLevel Info

# Only the internal subnet may use the proxy
Allow 172.28.0.0/24

# Health checks
Allow 127.0.0.1/32

# Domain allowlist (regex), default deny
Filter "/etc/tinyproxy/allowed_domains"
FilterType fnmatch
FilterDefaultDeny Yes

# HTTPS tunnels only to 443
ConnectPort 443

# Note: no User/Group/PidFile/LogFile, because we run non-root and log to stderr
