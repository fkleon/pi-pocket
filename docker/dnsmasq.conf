# Listen for queries on the container's interfaces.
listen-address=172.28.0.11
port=53
bind-interfaces

# Return NXDOMAIN for domains not explicitly forwarded below.
address=/#/

# Forward these domains, including their subdomains.
server=/pi.dev/#
